<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Master Word">
<meta name="theme-color" content="#101010">
<link rel="manifest" href="manifest.webmanifest">
<title>Master Word Trainer</title>
<style>
:root{--bg:#101010;--panel:#1b1b1c;--text:#f5f5f5;--muted:#9b9ba0;--line:#343437;--accent:#0a84ff;--yes:#30d158;--no:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{display:flex;justify-content:center}
main{width:min(680px,100%);padding:18px 16px 38px}
header{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px} h1{font-size:24px;margin:0}
.stats{font-size:12px;line-height:1.4;color:var(--muted);text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
h2{font-size:26px;line-height:1.22;margin:0 0 14px}
.prompt{opacity:0;transform:translateY(5px);transition:.22s ease;display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:17px;line-height:1.35}
.prompt.show{opacity:1;transform:none}.tick{color:var(--yes);font-weight:800;min-width:18px}
.example{font-size:13px;color:var(--muted);margin:-4px 0 8px 28px;opacity:0;transition:.22s}.example.show{opacity:1}
.words{display:grid;gap:12px;margin:18px 0}.word{border:1px solid var(--line);background:#0d0d0f;border-radius:14px;padding:18px 12px;text-align:center;font-size:30px;font-weight:750}
.category{text-align:center;font-size:13px;color:var(--muted);margin:3px 0 7px}.clues{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0 18px}
.chip{border:1px solid var(--line);background:#111113;border-radius:999px;padding:6px 10px;font-size:12px;color:#c7c7cc}
input{width:100%;border:1px solid var(--line);background:#0d0d0f;color:var(--text);border-radius:12px;padding:14px;font-size:22px;outline:none;margin:4px 0 10px}
button{width:100%;min-height:50px;border:0;border-radius:12px;padding:14px 16px;margin-top:7px;font-size:18px;font-weight:700;background:var(--accent);color:white}
button.secondary{background:#2c2c2e;color:var(--text)}button[disabled]{opacity:.25}
.result{font-size:58px;font-weight:850;text-align:center;padding:18px 0 8px}.yes{color:var(--yes)}.no{color:var(--no)}
.small{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>

}
function retry(){S.locked=false;app.innerHTML=`<h2>Three words</h2>${strip(false)}<p class="small">Previous: ${S.guesses.map(esc).join(', ')}</p><input id="g" autocomplete="off" autocapitalize="none" placeholder="Another guess"><button onclick="check()">Check</button><button class="secondary" onclick="giveUp()">Stop / reveal</button>`;setTimeout(()=>document.getElementById('g')?.focus(),50)}
function giveUp(){S.rounds++;save();draw();S.locked=true;app.innerHTML=`<h2>Master Word</h2><div class="word">${esc(S.item.master)}</div>${strip(true)}${S.guesses.length?`<p class="small">Your guesses: ${S.guesses.map(esc).join(', ')}</p>`:''}<button onclick="start()">NEW ROUND</button>`}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||S.locked)return;const x=document.activeElement;if(x&&x.tagName==='INPUT')check()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
start();
</script></body></html>
