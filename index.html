<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Master Word">
<meta name="theme-color" content="#101010">
<link rel="manifest" href="manifest.webmanifest">
<title>Master Word Trainer</title>
<style>
:root{--bg:#101010;--panel:#1b1b1c;--text:#f5f5f5;--muted:#9b9ba0;--line:#343437;--accent:#0a84ff;--yes:#30d158;--no:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{display:flex;justify-content:center}
main{width:min(680px,100%);padding:18px 16px 38px}
header{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px} h1{font-size:24px;margin:0}
.stats{font-size:12px;line-height:1.4;color:var(--muted);text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.stage{color:var(--muted);font-size:13px;margin-bottom:10px} h2{font-size:26px;line-height:1.22;margin:0 0 12px}
p{color:var(--muted);font-size:16px;line-height:1.45;margin:0 0 14px}
.big{font-size:34px;font-weight:750;text-align:center;padding:22px 8px}
.words{display:grid;gap:12px;margin:18px 0}.word{border:1px solid var(--line);background:#0d0d0f;border-radius:14px;padding:18px 12px;text-align:center;font-size:30px;font-weight:750}
.category{text-align:center;font-size:13px;color:var(--muted);margin:3px 0 7px}.clues{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0 18px}
.chip{border:1px solid var(--line);background:#111113;border-radius:999px;padding:6px 10px;font-size:12px;color:#c7c7cc}
input{width:100%;border:1px solid var(--line);background:#0d0d0f;color:var(--text);border-radius:12px;padding:14px;font-size:22px;outline:none;margin:4px 0 10px}
button{width:100%;min-height:50px;border:0;border-radius:12px;padding:14px 16px;margin-top:7px;font-size:18px;font-weight:700;background:var(--accent);color:white}
button.secondary{background:#2c2c2e;color:var(--text)} .result{font-size:58px;font-weight:850;text-align:center;padding:18px 0 8px}.yes{color:var(--yes)}.no{color:var(--no)}
kbd{font-family:inherit;border:1px solid var(--line);background:#29292c;border-radius:6px;padding:1px 6px}.small{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body><main><header><h1>Master Word Trainer</h1><div class="stats" id="stats"></div></header><div class="card" id="app"></div></main>
<script>
const BANK=[{"master": "elephant", "category": "animal", "categoryWord": "giraffe", "firstWord": "ember", "secondWord": "lantern"}, {"master": "axolotl", "category": "amphibian", "categoryWord": "newt", "firstWord": "avalanche", "secondWord": "xray"}, {"master": "spaniel", "category": "dog", "categoryWord": "terrier", "firstWord": "silver", "secondWord": "pocket"}, {"master": "platypus", "category": "mammal", "categoryWord": "otter", "firstWord": "piano", "secondWord": "lantern"}, {"master": "iguana", "category": "reptile", "categoryWord": "gecko", "firstWord": "island", "secondWord": "glow"}, {"master": "falcon", "category": "bird", "categoryWord": "heron", "firstWord": "fabric", "secondWord": "anchor"}, {"master": "lobster", "category": "crustacean", "categoryWord": "crab", "firstWord": "lantern", "secondWord": "orbit"}, {"master": "octopus", "category": "mollusc", "categoryWord": "squid", "firstWord": "opera", "secondWord": "cloud"}, {"master": "trout", "category": "fish", "categoryWord": "salmon", "firstWord": "tunnel", "secondWord": "river"}, {"master": "beetle", "category": "insect", "categoryWord": "moth", "firstWord": "beacon", "secondWord": "ember"}, {"master": "clown", "category": "entertainer", "categoryWord": "juggler", "firstWord": "candle", "secondWord": "lamp"}, {"master": "ophthalmologist", "category": "doctor", "categoryWord": "surgeon", "firstWord": "orbit", "secondWord": "harbour"}, {"master": "carpenter", "category": "tradesman", "categoryWord": "plumber", "firstWord": "copper", "secondWord": "anchor"}, {"master": "violinist", "category": "musician", "categoryWord": "pianist", "firstWord": "velvet", "secondWord": "island"}, {"master": "baker", "category": "tradesman", "categoryWord": "butcher", "firstWord": "balloon", "secondWord": "anchor"}, {"master": "pilot", "category": "professional", "categoryWord": "architect", "firstWord": "pepper", "secondWord": "island"}, {"master": "dentist", "category": "doctor", "categoryWord": "surgeon", "firstWord": "dragon", "secondWord": "ember"}, {"master": "magician", "category": "entertainer", "categoryWord": "comedian", "firstWord": "mirror", "secondWord": "anchor"}, {"master": "potter", "category": "artisan", "categoryWord": "weaver", "firstWord": "pocket", "secondWord": "orbit"}, {"master": "judge", "category": "professional", "categoryWord": "lawyer", "firstWord": "jungle", "secondWord": "umbrella"}, {"master": "violin", "category": "instrument", "categoryWord": "trumpet", "firstWord": "velvet", "secondWord": "island"}, {"master": "harpsichord", "category": "instrument", "categoryWord": "clarinet", "firstWord": "harbour", "secondWord": "anchor"}, {"master": "hammer", "category": "tool", "categoryWord": "chisel", "firstWord": "horizon", "secondWord": "anchor"}, {"master": "spanner", "category": "tool", "categoryWord": "pliers", "firstWord": "silver", "secondWord": "pocket"}, {"master": "scalpel", "category": "instrument", "categoryWord": "stethoscope", "firstWord": "silver", "secondWord": "candle"}, {"master": "ophthalmoscope", "category": "instrument", "categoryWord": "otoscope", "firstWord": "orbit", "secondWord": "harbour"}, {"master": "capacitor", "category": "component", "categoryWord": "resistor", "firstWord": "candle", "secondWord": "anchor"}, {"master": "transistor", "category": "component", "categoryWord": "diode", "firstWord": "tunnel", "secondWord": "rain"}, {"master": "gyroscope", "category": "device", "categoryWord": "compass", "firstWord": "garden", "secondWord": "yellow"}, {"master": "thermometer", "category": "instrument", "categoryWord": "barometer", "firstWord": "tunnel", "secondWord": "harbour"}, {"master": "microscope", "category": "instrument", "categoryWord": "telescope", "firstWord": "mirror", "secondWord": "island"}, {"master": "sextant", "category": "instrument", "categoryWord": "compass", "firstWord": "silver", "secondWord": "ember"}, {"master": "carrot", "category": "vegetable", "categoryWord": "turnip", "firstWord": "candle", "secondWord": "anchor"}, {"master": "rutabaga", "category": "vegetable", "categoryWord": "parsnip", "firstWord": "river", "secondWord": "umbrella"}, {"master": "apple", "category": "fruit", "categoryWord": "pear", "firstWord": "anchor", "secondWord": "pocket"}, {"master": "durian", "category": "fruit", "categoryWord": "mango", "firstWord": "dragon", "secondWord": "umbrella"}, {"master": "broccoli", "category": "vegetable", "categoryWord": "cabbage", "firstWord": "beacon", "secondWord": "river"}, {"master": "truffle", "category": "fungus", "categoryWord": "mushroom", "firstWord": "tunnel", "secondWord": "river"}, {"master": "basil", "category": "herb", "categoryWord": "parsley", "firstWord": "beacon", "secondWord": "anchor"}, {"master": "oak", "category": "tree", "categoryWord": "elm", "firstWord": "orbit", "secondWord": "anchor"}, {"master": "cactus", "category": "plant", "categoryWord": "fern", "firstWord": "candle", "secondWord": "anchor"}, {"master": "orchid", "category": "flower", "categoryWord": "tulip", "firstWord": "orbit", "secondWord": "river"}, {"master": "basalt", "category": "rock", "categoryWord": "granite", "firstWord": "beacon", "secondWord": "anchor"}, {"master": "marble", "category": "rock", "categoryWord": "slate", "firstWord": "mirror", "secondWord": "anchor"}, {"master": "molybdenum", "category": "element", "categoryWord": "copper", "firstWord": "mirror", "secondWord": "orbit"}, {"master": "quartz", "category": "mineral", "categoryWord": "mica", "firstWord": "quiet", "secondWord": "umbrella"}, {"master": "obsidian", "category": "rock", "categoryWord": "pumice", "firstWord": "orbit", "secondWord": "silver"}, {"master": "copper", "category": "metal", "categoryWord": "tin", "firstWord": "candle", "secondWord": "orbit"}, {"master": "graphite", "category": "mineral", "categoryWord": "quartz", "firstWord": "garden", "secondWord": "river"}, {"master": "amber", "category": "resin", "categoryWord": "copal", "firstWord": "anchor", "secondWord": "mirror"}, {"master": "chalk", "category": "rock", "categoryWord": "limestone", "firstWord": "candle", "secondWord": "harbour"}, {"master": "sapphire", "category": "gem", "categoryWord": "ruby", "firstWord": "silver", "secondWord": "anchor"}, {"master": "soffit", "category": "architecture", "categoryWord": "cornice", "firstWord": "silver", "secondWord": "orbit"}, {"master": "balustrade", "category": "architecture", "categoryWord": "architrave", "firstWord": "beacon", "secondWord": "anchor"}, {"master": "carburettor", "category": "component", "categoryWord": "radiator", "firstWord": "candle", "secondWord": "anchor"}, {"master": "gearbox", "category": "component", "categoryWord": "clutch", "firstWord": "garden", "secondWord": "ember"}, {"master": "tram", "category": "vehicle", "categoryWord": "bus", "firstWord": "tunnel", "secondWord": "river"}, {"master": "kayak", "category": "boat", "categoryWord": "canoe", "firstWord": "kettle", "secondWord": "anchor"}, {"master": "saxophone", "category": "instrument", "categoryWord": "oboe", "firstWord": "silver", "secondWord": "anchor"}, {"master": "anvil", "category": "tool", "categoryWord": "vice", "firstWord": "anchor", "secondWord": "navy"}, {"master": "lantern", "category": "light", "categoryWord": "torch", "firstWord": "lemon", "secondWord": "anchor"}, {"master": "teapot", "category": "container", "categoryWord": "jug", "firstWord": "tunnel", "secondWord": "ember"}, {"master": "caliper", "category": "instrument", "categoryWord": "micrometer", "firstWord": "candle", "secondWord": "anchor"}, {"master": "retort", "category": "glassware", "categoryWord": "beaker", "firstWord": "river", "secondWord": "ember"}, {"master": "crucible", "category": "container", "categoryWord": "flask", "firstWord": "candle", "secondWord": "river"}, {"master": "turbine", "category": "machine", "categoryWord": "engine", "firstWord": "tunnel", "secondWord": "umbrella"}, {"master": "solenoid", "category": "component", "categoryWord": "relay", "firstWord": "silver", "secondWord": "orbit"}, {"master": "mandolin", "category": "instrument", "categoryWord": "banjo", "firstWord": "mirror", "secondWord": "anchor"}, {"master": "dulcimer", "category": "instrument", "categoryWord": "zither", "firstWord": "dragon", "secondWord": "umbrella"}, {"master": "coracle", "category": "boat", "categoryWord": "dinghy", "firstWord": "candle", "secondWord": "orbit"}, {"master": "trilobite", "category": "fossil", "categoryWord": "ammonite", "firstWord": "tunnel", "secondWord": "river"}, {"master": "nautilus", "category": "mollusc", "categoryWord": "squid", "firstWord": "navy", "secondWord": "anchor"}, {"master": "cormorant", "category": "bird", "categoryWord": "pelican", "firstWord": "candle", "secondWord": "orbit"}, {"master": "weevil", "category": "insect", "categoryWord": "beetle", "firstWord": "wind", "secondWord": "ember"}, {"master": "anemone", "category": "flower", "categoryWord": "dahlia", "firstWord": "anchor", "secondWord": "navy"}, {"master": "turnstile", "category": "barrier", "categoryWord": "gate", "firstWord": "tunnel", "secondWord": "umbrella"}, {"master": "grommet", "category": "fastener", "categoryWord": "rivet", "firstWord": "garden", "secondWord": "river"}, {"master": "riveter", "category": "tool", "categoryWord": "drill", "firstWord": "river", "secondWord": "island"}, {"master": "bellows", "category": "tool", "categoryWord": "tongs", "firstWord": "beacon", "secondWord": "ember"}, {"master": "stirrup", "category": "tack", "categoryWord": "saddle", "firstWord": "silver", "secondWord": "tunnel"}];
const app=document.getElementById('app'),stats=document.getElementById('stats');
let S={item:null,step:0,guesses:[],locked:false,rounds:+localStorage.getItem('mw4_r')||0,first:+localStorage.getItem('mw4_f')||0,later:+localStorage.getItem('mw4_l')||0};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const norm=s=>s.trim().toLowerCase().replace(/[^a-z0-9'-]+/g,' ');
function save(){localStorage.setItem('mw4_r',S.rounds);localStorage.setItem('mw4_f',S.first);localStorage.setItem('mw4_l',S.later)}
function draw(){let p=S.rounds?Math.round(S.first/S.rounds*100):0;stats.innerHTML=`Rounds ${S.rounds} · First ${S.first}<br>Later ${S.later} · ${p}%`}
function choose(){const last=sessionStorage.getItem('mw4_last');let pool=BANK.filter(x=>x.master!==last);S.item=pool[Math.floor(Math.random()*pool.length)];sessionStorage.setItem('mw4_last',S.item.master);S.step=0;S.guesses=[];S.locked=false}
function strip(){return `<div class="category">Category: <b>${esc(S.item.category)}</b></div><div class="clues"><span class="chip">${esc(S.item.categoryWord)}</span><span class="chip">${esc(S.item.firstWord)}</span><span class="chip">${esc(S.item.secondWord)}</span></div>`}
function thought(){const t=['Think of a word.','Think of the category it belongs to. Just one word.','Think of another word that fits that category.','Think of an interesting word beginning with the first letter.','Think of a short word beginning with the second letter.'];app.innerHTML=`<div class="stage">${S.step+1} of 5</div><h2>${t[S.step]}</h2>${S.step===1?'<p>For example, an elephant is an <b>ANIMAL</b>, a violin is an <b>INSTRUMENT</b>, a clown is an <b>ENTERTAINER</b>.</p>':''}<div class="big">✓</div><button onclick="advance()">NEXT</button><p class="small">Mac: Return also works.</p>`}
function start(){choose();draw();thought()}
function advance(){if(S.locked)return;if(S.step<4){S.step++;thought()}else reveal()}
function reveal(){S.locked=false;app.innerHTML=`<div class="stage">Clues</div><h2>Three words</h2><div class="words"><div class="word">${esc(S.item.categoryWord)}</div><div class="word">${esc(S.item.firstWord)}</div><div class="word">${esc(S.item.secondWord)}</div></div><input id="g" autocomplete="off" autocapitalize="none" placeholder="Your guess"><button onclick="check()">Check</button><button class="secondary" onclick="giveUp()">Stop / reveal</button>`;setTimeout(()=>document.getElementById('g')?.focus(),50)}
function check(){const e=document.getElementById('g'),g=e&&e.value.trim();if(!g)return;const n=S.guesses.length+1;S.guesses.push(g);if(norm(g)===norm(S.item.master)){S.rounds++;if(n===1)S.first++;else S.later++;save();draw();S.locked=true;app.innerHTML=`<div class="result yes">YES</div><p style="text-align:center">Master Word: <b>${esc(S.item.master)}</b></p>${strip()}<p style="text-align:center">Correct on guess ${n}.</p><button onclick="start()">Next round</button><div class="small">Tap Next round.</div>`}else{S.locked=true;app.innerHTML=`<div class="result no">NO</div>${strip()}<p style="text-align:center">Previous guesses: ${S.guesses.map(esc).join(', ')}</p><button onclick="retry()">Another guess</button><button class="secondary" onclick="giveUp()">Stop / reveal</button><div class="small">Result stays put.</div>`}}
function retry(){S.locked=false;app.innerHTML=`<div class="stage">Clues</div>${strip()}<p>Previous guesses: ${S.guesses.map(esc).join(', ')}</p><input id="g" autocomplete="off" autocapitalize="none" placeholder="Another guess"><button onclick="check()">Check</button><button class="secondary" onclick="giveUp()">Stop / reveal</button>`;setTimeout(()=>document.getElementById('g')?.focus(),50)}
function giveUp(){S.rounds++;save();draw();S.locked=true;app.innerHTML=`<h2>Master Word</h2><div class="word">${esc(S.item.master)}</div>${strip()}${S.guesses.length?`<p style="text-align:center">Your guesses: ${S.guesses.map(esc).join(', ')}</p>`:''}<button onclick="start()">Next round</button><div class="small">Tap Next round.</div>`}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||S.locked)return;const x=document.activeElement;if(x&&x.tagName==='INPUT'){check();return}advance()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
draw();start();
</script></body></html>
