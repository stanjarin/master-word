<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100%}
.top{height:57px;display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid #292929}
.yt{width:32px;height:23px;background:#f03a2c;border-radius:7px;display:grid;place-items:center}
.tri{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #fff;margin-left:2px}
.logo{font-size:21px;font-weight:800}.search{margin-left:auto;font-size:25px;color:#bbb}
.stage{position:relative;background:#000;width:100%;aspect-ratio:16/9;overflow:hidden;-webkit-user-select:none;user-select:none}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.cover{position:absolute;inset:0;display:grid;place-items:center}
.play{width:76px;height:54px;border-radius:15px;background:#e52d20;display:grid;place-items:center}.play .tri{border-top-width:11px;border-bottom-width:11px;border-left-width:18px}
.info{padding:16px}.title{font-size:20px;line-height:1.3;font-weight:650}.meta{color:#aaa;font-size:13px;margin-top:7px}
.channel{display:flex;align-items:center;gap:11px;border-top:1px solid #292929;margin-top:18px;padding-top:16px}
.avatar{width:40px;height:40px;border-radius:50%;background:#858585}.name{font-size:17px;font-weight:650}.sub{font-size:12px;color:#aaa;margin-top:3px}
.debug{margin:8px 16px;padding:9px 11px;border:1px solid #2c2c2c;border-radius:10px;color:#777;font-size:11px;min-height:31px}
.good{color:#30d158}.bad{color:#ff453a}
</style></head>
<body>
<div class="top"><div class="yt"><div class="tri"></div></div><div class="logo">YouTube</div><div class="search">⌕</div></div>
<div class="stage" id="stage">
 <video id="video" playsinline preload="auto" src="lucky.mp4"></video>
 <div class="cover" id="cover"><div class="play"><div class="tri"></div></div></div>
</div>
<div class="info">
 <div class="title">I've Been Everywhere — Lucky Starr</div>
 <div class="meta">Thinking music</div>
 <div class="channel"><div class="avatar"></div><div><div class="name">Lucky Starr</div><div class="sub">I've Been Everywhere</div></div></div>
</div>
<div class="debug" id="debug">W5 — tap video, speak three words + OK.</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const V=document.getElementById('video'), ST=document.getElementById('stage'),
C=document.getElementById('cover'), D=document.getElementById('debug');
let rec=null, transcript='', captured=false, holdTimer=null, suppress=false;

function dbg(s,c=''){D.className='debug '+c;D.textContent=s}

function startListening(){
 if(captured){ if(V.paused)V.play().catch(()=>{}); else V.pause(); return; }
 if(!SR){dbg('SpeechRecognition unavailable.','bad');return}
 transcript='';
 dbg('LISTENING… say three words, then OK.','good');
 C.style.display='none';

 rec=new SR();
 rec.lang='en-AU';
 rec.continuous=true;
 rec.interimResults=true;

 rec.onresult=e=>{
   let finals='', interim='';
   for(let i=e.resultIndex;i<e.results.length;i++){
     const x=e.results[i][0].transcript;
     if(e.results[i].isFinal) finals+=' '+x; else interim+=' '+x;
   }
   if(finals) transcript=(transcript+' '+finals).replace(/\s+/g,' ').trim();
   const heard=(transcript+' '+interim).replace(/\s+/g,' ').trim();
   dbg('Heard: '+heard);
   if(/\b(okay|ok)\b/i.test(heard)){
      transcript=heard.replace(/\b(okay|ok)\b.*$/i,'').trim();
      captured=true;
      try{rec.stop()}catch(_){}
      dbg('Captured: '+transcript,'good');
      V.currentTime=0;
      V.play().catch(()=>dbg('Captured. Tap video once to start Lucky.','bad'));
   }
 };
 rec.onerror=e=>dbg('Voice error: '+e.error,'bad');
 rec.onend=()=>{ if(!captured) dbg('Stopped before OK. Tap video and try again.','bad'); };
 try{rec.start()}catch(e){dbg('Could not start recognition.','bad')}
}

function promptText(){
 return `Infer a hidden MASTER WORD from three spoken clues. Speech recognition may have errors. Clue 1 is another word in the same plausible category as the master word. Clue 2 begins with the same FIRST LETTER as the master word. Clue 3 begins with the same SECOND LETTER as the master word. Clues: "${transcript}". Return 8 likely master words, best first, no explanation.`;
}
function openChat(){
 if(!captured){dbg('No clues captured.','bad');return}
 V.pause();
 location.href='https://chatgpt.com/?q='+encodeURIComponent(promptText());
}

const begin=()=>{suppress=false;holdTimer=setTimeout(()=>{suppress=true;openChat()},700)};
const end=()=>clearTimeout(holdTimer);

ST.addEventListener('touchstart',begin,{passive:true});
ST.addEventListener('touchend',()=>{end();if(!suppress)startListening()},{passive:true});
ST.addEventListener('touchmove',end,{passive:true});
ST.addEventListener('mousedown',begin);
ST.addEventListener('mouseup',()=>{end();if(!suppress)startListening()});
ST.addEventListener('mouseleave',end);
</script></body></html>
