<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100%}
.top{height:57px;display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid #292929}
.yt{width:32px;height:23px;background:#f03a2c;border-radius:7px;display:grid;place-items:center}
.tri{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #fff;margin-left:2px}
.logo{font-size:21px;font-weight:800}.search{margin-left:auto;font-size:25px;color:#bbb}
.stage{position:relative;background:#000;width:100%;height:62vh;min-height:480px;max-height:720px;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.armbtn,.playbtn{position:absolute;inset:0;margin:auto;width:76px;height:54px;border:0;border-radius:15px;background:#e52d20;display:grid;place-items:center;z-index:4}
.armbtn .tri,.playbtn .tri{border-top-width:11px;border-bottom-width:11px;border-left-width:18px}
.info{padding:16px}.title{font-size:20px;line-height:1.3;font-weight:650}.meta{color:#aaa;font-size:13px;margin-top:7px}
.channel{display:flex;align-items:center;gap:11px;border-top:1px solid #292929;margin-top:18px;padding-top:16px}
.avatarbtn{width:104px;height:78px;border:0;background:transparent;padding:19px 44px 19px 0;flex:0 0 104px;position:relative}
.avatarbtn:after{content:"";position:absolute;left:0;top:19px;width:40px;height:40px;border-radius:50%;background:#858585}
.name{font-size:17px;font-weight:650}.sub{font-size:12px;color:#aaa;margin-top:3px}
.debug{margin:8px 16px;padding:9px 11px;border:1px solid #2c2c2c;border-radius:10px;color:#777;font-size:11px;min-height:31px}
.good{color:#30d158}.bad{color:#ff453a}
</style>
</head>
<body>
<div class="top"><div class="yt"><div class="tri"></div></div><div class="logo">YouTube</div><div class="search">⌕</div></div>

<div class="stage">
 <video id="video" playsinline preload="auto" src="video1.mp4"></video>
 <button class="armbtn" id="arm" aria-label="Play"><div class="tri"></div></button>
 <button class="playbtn" id="play" aria-label="Play" style="display:none"><div class="tri"></div></button>
</div>

<div class="info">
 <div class="title">Random Tunes For Your Thoughts</div>
 <div class="meta">Thinking music</div>
 <div class="channel">
   <button class="avatarbtn" id="avatar" aria-label="Channel"></button>
   <div><div class="name">Random Tunes</div><div class="sub">for your thoughts</div></div>
 </div>
</div>
<div class="debug" id="debug">V2.3 — big Brolga + terminal mic state.</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const V=document.getElementById('video');
const ARM=document.getElementById('arm');
const PLAY=document.getElementById('play');
const AV=document.getElementById('avatar');
const D=document.getElementById('debug');

let rec=null, finalText='', clues=[], armed=false, musicStarted=false, chatOpened=false, finished=false;

function dbg(s,c=''){D.className='debug '+c;D.textContent=s}
function words(s){return s.trim().split(/\s+/).filter(Boolean)}
function firstLetter(s){return ((s.match(/[A-Za-z]/)||[''])[0]||'').toUpperCase()}

function promptText(){
 const c1=clues[0]||'', c2=clues[1]||'', c3=clues[2]||'';
 const a=firstLetter(c2), b=firstLetter(c3), prefix=a+b;
 return `Infer a hidden MASTER WORD from exactly three spoken clues.
Clue 1: "${c1}". This is another member of a plausible category containing the MASTER WORD. The category is not given; infer plausible category levels and BROADEN if needed.
Clue 2: "${c2}". Only its FIRST LETTER matters: the MASTER WORD begins with "${a}".
Clue 3: "${c3}". Only its FIRST LETTER matters: the SECOND LETTER of the MASTER WORD is "${b}".
Every candidate MUST begin exactly "${prefix}". Do not output candidates beginning with different letters.
Speech recognition may have misheard a clue; allow plausible corrections.
Return exactly 8 likely one-word concrete nouns, best first, no explanation.`;
}

ARM.addEventListener('click',()=>{
 if(armed)return;
 armed=true;
 ARM.style.display='none';
 PLAY.style.display='grid';

 if(!SR){dbg('SpeechRecognition unavailable.','bad');return}
 dbg('LISTENING…','good');

 rec=new SR();
 rec.lang='en-AU';
 rec.continuous=true;
 rec.interimResults=true;

 rec.onresult=e=>{
   let newFinal='', interim='';
   for(let i=e.resultIndex;i<e.results.length;i++){
     const t=e.results[i][0].transcript;
     if(e.results[i].isFinal)newFinal+=' '+t;
     else interim+=' '+t;
   }
   if(newFinal) finalText=(finalText+' '+newFinal).replace(/\s+/g,' ').trim();
   const w=words(finalText);
   if(clues.length<3 && w.length>=3) clues=w.slice(0,3);

   const prefix=clues.length===3 ? firstLetter(clues[1])+firstLetter(clues[2]) : '--';
   dbg('FINAL: '+finalText+' | PREFIX: '+prefix);
 };
 rec.onerror=e=>dbg('Voice error: '+e.error,'bad');
 rec.onend=()=>{
   if(armed && !musicStarted && !finished){
     try{rec.start()}catch(_){}
   }
 };
 try{rec.start()}catch(e){dbg('Could not start recognition.','bad')}
});

PLAY.addEventListener('click',()=>{
 if(clues.length!==3){
   dbg('Need 3 finalised clues before playback.','bad');
   return;
 }
 musicStarted=true;
 finished=true;
 armed=false;
 if(rec){rec.onend=null;try{rec.abort()}catch(_){}}
 PLAY.style.display='none';
 dbg('LOCKED: '+clues.join(' | ')+'  PREFIX: '+firstLetter(clues[1])+firstLetter(clues[2]),'good');
 V.currentTime=0;
 V.play().catch(e=>dbg('Playback blocked: '+e.name,'bad'));
});

AV.addEventListener('click',()=>{
 if(!musicStarted || chatOpened || clues.length!==3)return;
 chatOpened=true;
 const q=promptText();
 dbg('CHAT: '+clues.join(' | ')+'  PREFIX: '+firstLetter(clues[1])+firstLetter(clues[2]),'good');
 window.open('https://chatgpt.com/?q='+encodeURIComponent(q),'thinkingChat');
});

V.addEventListener('click',()=>{
 if(!musicStarted)return;
 if(V.paused)V.play().catch(()=>{});
 else V.pause();
});
V.addEventListener('ended',()=>{
 finished=true; armed=false;
 if(rec){rec.onend=null;try{rec.abort()}catch(_){}}
 try{V.currentTime=Math.max(0,V.duration-0.04)}catch(_){}
 dbg('DONE: '+clues.join(' | ')+'  PREFIX: '+firstLetter(clues[1])+firstLetter(clues[2]),'good');
});
</script>
</body>
</html>
