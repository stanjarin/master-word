<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.webmanifest">
<title>Thinking Music</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100%}
body{display:flex;justify-content:center}.phone{width:min(680px,100%);min-height:100vh;background:#0f0f0f}
.top{height:58px;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #272727;position:sticky;top:0;background:#0f0f0f;z-index:3}
.logo{font-weight:800;font-size:20px}.playlogo{width:30px;height:22px;border-radius:7px;background:#f00;display:grid;place-items:center}.tri{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid white;margin-left:2px}
.search{margin-left:auto;color:#aaa;font-size:22px}
.video{aspect-ratio:16/9;background:#000;display:grid;place-items:center;position:relative;overflow:hidden;user-select:none}
.video .bigplay{width:70px;height:50px;border-radius:14px;background:#e00;display:grid;place-items:center}
.video .bigplay .tri{border-top-width:10px;border-bottom-width:10px;border-left-width:16px}
.video.playing:after{content:"PLAYING";position:absolute;right:10px;bottom:8px;font-size:11px;background:#000b;padding:5px 7px;border-radius:4px}
.video.frozen:after{content:"PAUSED";position:absolute;right:10px;bottom:8px;font-size:11px;background:#000b;padding:5px 7px;border-radius:4px}
.info{padding:14px 16px}.title{font-size:19px;font-weight:650;line-height:1.3}.meta{color:#aaa;font-size:13px;margin-top:6px}.channel{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid #292929}.avatar{width:38px;height:38px;border-radius:50%;background:#777}.chname{font-weight:650}.sub{font-size:12px;color:#aaa}
.hiddenbox{margin:14px 16px;padding:12px;border:1px solid #333;border-radius:12px;color:#999;font-size:13px;display:none}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#292929;border-radius:999px;padding:11px 16px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}
.setup{padding:28px 20px}.setup h1{font-size:26px}.setup p{color:#aaa;line-height:1.45}.setup button{width:100%;border:0;border-radius:14px;background:#f00;color:#fff;font-size:19px;font-weight:750;padding:17px;margin-top:12px}
.debug{font-size:12px;color:#777;margin-top:18px;word-break:break-word}
</style></head>
<body><div class="phone" id="app"></div><div class="toast" id="toast"></div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const app=document.getElementById('app'),toast=document.getElementById('toast');
let transcript='',rec=null,performer='Lucky Starr',attempt=1;

function sayToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
function youtubeScreen(state='ready'){
 app.innerHTML=`<div class="top"><div class="playlogo"><div class="tri"></div></div><div class="logo">YouTube</div><div class="search">⌕</div></div>
 <div class="video ${state}" id="vid"><div class="bigplay"><div class="tri"></div></div></div>
 <div class="info"><div class="title">I've Been Everywhere — ${performer}</div><div class="meta">Thinking music</div>
 <div class="channel"><div class="avatar"></div><div><div class="chname">${performer}</div><div class="sub">I've Been Everywhere</div></div></div></div>
 <div class="hiddenbox" id="dbg"></div>`;
 const v=document.getElementById('vid');
 let timer;
 v.addEventListener('touchstart',e=>{timer=setTimeout(secret,650)},{passive:true});
 v.addEventListener('touchend',()=>clearTimeout(timer),{passive:true});
 v.addEventListener('touchmove',()=>clearTimeout(timer),{passive:true});
 v.addEventListener('mousedown',()=>timer=setTimeout(secret,650));
 v.addEventListener('mouseup',()=>clearTimeout(timer));
 v.addEventListener('mouseleave',()=>clearTimeout(timer));
}
function start(){
 if(!SR){app.innerHTML='<div class="setup"><h1>No speech recognition</h1><p>This browser does not expose SpeechRecognition.</p></div>';return}
 transcript='';attempt=1;performer='Lucky Starr';youtubeScreen('ready');
 rec=new SR();rec.lang='en-AU';rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{
   let final='',interim='';
   for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=' '+t;else interim+=' '+t}
   transcript=(transcript+' '+final).replace(/\\s+/g,' ').trim();
   let heard=(transcript+' '+interim).replace(/\\s+/g,' ').trim();
   if(/\\b(okay|ok)\\b/i.test(heard)){
      transcript=heard.replace(/\\b(okay|ok)\\b.*$/i,'').trim();
      try{rec.stop()}catch(e){}
      youtubeScreen('playing'); sayToast('Thinking music…');
      setTimeout(()=>document.getElementById('vid')?.classList.add('frozen'),4500);
   }
 };
 rec.onerror=e=>sayToast('Voice error: '+e.error);
 try{rec.start();sayToast('Listening…')}catch(e){sayToast('Could not listen')}
}
function promptText(){
 return `You are helping with a word-retrieval puzzle. Infer the hidden MASTER WORD from three spoken clues. The speech transcription may contain errors, so correct plausible mishearings. Clue 1 is another word from the same category as the master word. Clue 2 begins with the same FIRST LETTER as the master word. Clue 3 begins with the same SECOND LETTER as the master word. Spoken clues: "${transcript}". Give the 8 most likely master words only, best first. No explanation.`;
}
async function secret(){
 if(!transcript){sayToast('No clues captured');return}
 const q=promptText();
 try{await navigator.clipboard.writeText(q)}catch(e){}
 // Workshop test: use ChatGPT web query URL. If iOS/ChatGPT accepts ?q=, it should arrive prefilled/submitted.
 location.href='https://chatgpt.com/?q='+encodeURIComponent(q);
}
function fallback(){
 attempt++;performer='Johnny Cash';youtubeScreen('playing');sayToast('This might work better…');
}
function setup(){
 app.innerHTML=`<div class="setup"><h1>Thinking Music — Workshop 1</h1>
 <p>This tests the actual performance chain. Tap the red button (standing in for the YouTube icon), then simply say the three clues followed by <b>OK</b>.</p>
 <p>On OK it becomes the Lucky Starr screen. <b>Long-press the video</b> to invoke the ChatGPT web query.</p>
 <button onclick="start()">YOUTUBE</button>
 <div class="debug">Speech API: ${SR?'YES':'NO'}<br>Prototype only: cosmetics and real Lucky Starr playback come after the hand-off test passes.</div></div>`;
}
setup();
</script></body></html>
