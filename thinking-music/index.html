<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thinking Music W2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#eee;font-family:-apple-system,Arial}.top{padding:16px;font-size:21px;font-weight:bold;border-bottom:1px solid #333}.listen{margin:18px;width:calc(100% - 36px);padding:17px;border:0;border-radius:14px;background:#f00;color:#fff;font-size:20px;font-weight:bold}.video{margin-top:4px;aspect-ratio:16/9;background:#000;display:grid;place-items:center;position:relative;-webkit-user-select:none;user-select:none}.play{width:72px;height:50px;background:#e00;border-radius:14px;display:grid;place-items:center}.tri{width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #fff}.state{position:absolute;bottom:8px;left:9px;background:#000;padding:5px}.info,.read{padding:15px 18px}.title{font-size:20px;font-weight:650}.read{margin:12px 18px;border:1px solid #444;border-radius:12px;min-height:55px;color:#bbb}.good{color:#30d158}.bad{color:#ff453a}</style></head>
<body><div class="top">▶ YouTube</div><button class="listen" id="listen">LISTEN</button><div class="video" id="video"><div class="play"><div class="tri"></div></div><div class="state" id="state">READY</div></div><div class="info"><div class="title">I've Been Everywhere — Lucky Starr</div><div>Thinking music</div></div><div class="read" id="read">Tap LISTEN.</div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,L=document.getElementById('listen'),R=document.getElementById('read'),S=document.getElementById('state'),V=document.getElementById('video');let rec,text='',ready=false,timer;
L.onclick=()=>{if(!SR){R.innerHTML='<span class="bad">Speech recognition unavailable.</span>';return}text='';ready=false;L.disabled=true;L.textContent='LISTENING…';S.textContent='LISTENING';R.innerHTML='<span class="good">LISTENING — say 3 words, then OK</span>';rec=new SR();rec.lang='en-AU';rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){let x=e.results[n][0].transcript;e.results[n].isFinal?f+=' '+x:i+=' '+x}if(f)text=(text+' '+f).replace(/\s+/g,' ').trim();let heard=(text+' '+i).replace(/\s+/g,' ').trim();R.textContent='Heard: '+heard;if(/\b(okay|ok)\b/i.test(heard)){text=heard.replace(/\b(okay|ok)\b.*$/i,'').trim();ready=true;rec.stop();L.textContent='CAPTURED';S.textContent='PLAYING';R.innerHTML='<span class="good">CAPTURED:</span> '+text+'<br>Long-press the video.'}};rec.onerror=e=>{R.innerHTML='<span class="bad">Voice error: '+e.error+'</span>';L.disabled=false;L.textContent='LISTEN'};rec.onend=()=>{if(!ready){L.disabled=false;L.textContent='LISTEN';S.textContent='STOPPED'}};rec.start()};
function go(){if(!ready){R.innerHTML='<span class="bad">Capture words first.</span>';return}let q=`Infer a hidden MASTER WORD from three spoken clues. Speech recognition may have errors. Clue 1 is another word in the same plausible category as the master word. Clue 2 begins with the same FIRST LETTER as the master word. Clue 3 begins with the same SECOND LETTER as the master word. Clues: "${text}". Return 8 likely master words, best first, no explanation.`;location.href='https://chatgpt.com/?q='+encodeURIComponent(q)}
const begin=()=>timer=setTimeout(go,700),cancel=()=>clearTimeout(timer);V.addEventListener('touchstart',begin,{passive:true});V.addEventListener('touchend',cancel,{passive:true});V.addEventListener('touchmove',cancel,{passive:true});V.addEventListener('mousedown',begin);V.addEventListener('mouseup',cancel);
</script></body></html>
