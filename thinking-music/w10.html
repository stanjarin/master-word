<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100%}
.top{height:57px;display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid #292929}
.yt{width:32px;height:23px;background:#f03a2c;border-radius:7px;display:grid;place-items:center}
.tri{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #fff;margin-left:2px}
.logo{font-size:21px;font-weight:800}.search{margin-left:auto;font-size:25px;color:#bbb}
.stage{position:relative;background:#000;width:100%;aspect-ratio:16/9;overflow:hidden;-webkit-user-select:none;user-select:none}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.playbtn{position:absolute;inset:0;margin:auto;width:76px;height:54px;border:0;border-radius:15px;background:#e52d20;display:grid;place-items:center}
.playbtn .tri{border-top-width:11px;border-bottom-width:11px;border-left-width:18px}
.info{padding:16px}.title{font-size:20px;line-height:1.3;font-weight:650}.meta{color:#aaa;font-size:13px;margin-top:7px}
.channel{display:flex;align-items:center;gap:11px;border-top:1px solid #292929;margin-top:18px;padding-top:16px}
.avatar{width:40px;height:40px;border-radius:50%;background:#858585}.name{font-size:17px;font-weight:650}.sub{font-size:12px;color:#aaa;margin-top:3px}
.debug{margin:8px 16px;padding:9px 11px;border:1px solid #2c2c2c;border-radius:10px;color:#777;font-size:11px;min-height:31px}
.good{color:#30d158}.bad{color:#ff453a}
</style></head>
<body>
<div class="top"><div class="yt"><div class="tri"></div></div><div class="logo">YouTube</div><div class="search">⌕</div></div>
<div class="stage" id="stage">
 <video id="video" playsinline preload="auto" src="lucky.mp4"></video>
 <button class="playbtn" id="playbtn" aria-label="Play"><div class="tri"></div></button>
</div>
<div class="info">
 <div class="title" id="title">I've Been Everywhere — Lucky Starr</div>
 <div class="meta">Thinking music</div>
 <div class="channel"><div class="avatar"></div><div><div class="name" id="artist">Lucky Starr</div><div class="sub">I've Been Everywhere</div></div></div>
</div>
<div class="debug" id="debug">W10 — persistent phase state.</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const V=document.getElementById('video'),P=document.getElementById('playbtn'),
ST=document.getElementById('stage'),D=document.getElementById('debug'),
T=document.getElementById('title'),A=document.getElementById('artist');

const KEY='thinkingMusicW10';
let rec=null,raw='',clues=[],captured=false,holdTimer=null,longFired=false;

function dbg(s,c=''){D.className='debug '+c;D.textContent=s}
function parseClues(s){
 let x=s.replace(/\b(okay|ok)\b.*$/i,'').trim();
 let parts=x.split(/[,.!?;]+/).map(v=>v.trim()).filter(Boolean);
 if(parts.length===3)return parts;
 let words=x.split(/\s+/).filter(Boolean);
 return words.length>=3?words.slice(-3):words;
}
function getState(){
 try{return JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(e){return null}
}
function setState(s){sessionStorage.setItem(KEY,JSON.stringify(s))}
function clearState(){sessionStorage.removeItem(KEY)}

function setPerformer(who){
 if(who==='cash'){
   V.src='cash.mp4';T.textContent="I've Been Everywhere — Johnny Cash";A.textContent='Johnny Cash';
 }else{
   V.src='lucky.mp4';T.textContent="I've Been Everywhere — Lucky Starr";A.textContent='Lucky Starr';
 }
 V.load();P.style.display='none';
}
function promptFor(second=false){
 const c1=clues[0]||'',c2=clues[1]||'',c3=clues[2]||'';
 const a=(c2.match(/[A-Za-z]/)||[''])[0].toUpperCase();
 const b=(c3.match(/[A-Za-z]/)||[''])[0].toUpperCase();
 const prefix=a+b;
 return `Infer a hidden MASTER WORD from exactly three spoken clues.
Clue 1: "${c1}". This is another member of a plausible category containing the MASTER WORD. The category is not given; infer plausible category levels and BROADEN if needed.
Clue 2: "${c2}". Only its FIRST LETTER matters: the MASTER WORD begins with "${a}".
Clue 3: "${c3}". Only its FIRST LETTER matters: the SECOND LETTER of the MASTER WORD is "${b}".
Every candidate MUST begin exactly "${prefix}". Do not output candidates beginning with different letters.
Speech recognition may have misheard a clue; allow plausible corrections.
Return exactly 8 likely one-word concrete nouns, best first, no explanation.${second?' The previous 8 failed. Use DIFFERENT candidates and broaden the category further.':''}`;
}
function openChat(second=false){
 if(!captured)return;
 const st=getState()||{};
 setState({...st,phase:second?'CHAT2':'CHAT1',clues,raw,time:V.currentTime,performer:second?'cash':'lucky'});
 const q=promptFor(second);
 window.open('https://chatgpt.com/?q='+encodeURIComponent(q),'thinkingChat');
 dbg(second?'Chat 2 opened.':'Chat 1 opened.','good');
}
function switchCash(){
 setPerformer('cash');
 setState({phase:'CASH',clues,raw,time:0,performer:'cash'});
 dbg('This might work better.','good');
 V.currentTime=0;V.play().catch(e=>dbg('Cash playback blocked: '+e.name,'bad'));
}

P.addEventListener('click',()=>{
 clearState();
 if(!SR){dbg('SpeechRecognition unavailable.','bad');return}
 raw='';clues=[];captured=false;
 V.src='lucky.mp4';V.load();
 dbg('LISTENING… say three clues, then OK.','good');

 rec=new SR();rec.lang='en-AU';rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{
  let f='',i='';
  for(let n=e.resultIndex;n<e.results.length;n++){const x=e.results[n][0].transcript;e.results[n].isFinal?f+=' '+x:i+=' '+x}
  if(f)raw=(raw+' '+f).replace(/\s+/g,' ').trim();
  const heard=(raw+' '+i).replace(/\s+/g,' ').trim();dbg('Heard: '+heard);
  if(/\b(okay|ok)\b/i.test(heard)){
    raw=heard.replace(/\b(okay|ok)\b.*$/i,'').trim();clues=parseClues(raw);captured=true;
    try{rec.stop()}catch(_){}
    P.style.display='none';
    setState({phase:'LUCKY',clues,raw,time:0,performer:'lucky'});
    dbg('Captured: '+clues.join(' / '),'good');
    V.currentTime=0;V.play().catch(e=>dbg('Playback blocked: '+e.name,'bad'));
  }
 };
 rec.onerror=e=>dbg('Voice error: '+e.error,'bad');
 rec.onend=()=>{if(!captured)dbg('Stopped before OK.','bad')};
 try{rec.start()}catch(e){dbg('Could not start recognition.','bad')}
});

function longAction(){
 if(!captured)return;
 const st=getState()||{phase:'LUCKY'};
 if(st.phase==='LUCKY'){
   openChat(false);
   return;
 }
 if(st.phase==='RETURN1' || st.phase==='CHAT1'){
   switchCash();
   return;
 }
 if(st.phase==='CASH'){
   openChat(true);
   return;
 }
 if(st.phase==='RETURN2' || st.phase==='CHAT2'){
   dbg('Second pass already done.','good');
 }
}
function begin(){if(!captured)return;longFired=false;holdTimer=setTimeout(()=>{longFired=true;longAction()},700)}
function cancel(){clearTimeout(holdTimer)}
ST.addEventListener('touchstart',begin,{passive:true});ST.addEventListener('touchend',cancel,{passive:true});ST.addEventListener('touchmove',cancel,{passive:true});
ST.addEventListener('mousedown',begin);ST.addEventListener('mouseup',cancel);ST.addEventListener('mouseleave',cancel);
V.addEventListener('click',()=>{if(!captured||longFired)return;if(V.paused)V.play().catch(()=>{});else V.pause()});

function restoreFromState(){
 const st=getState();
 if(!st)return;
 clues=st.clues||[];raw=st.raw||'';captured=clues.length>0;
 if(!captured)return;
 P.style.display='none';
 setPerformer(st.performer||'lucky');

 const restore=()=>{
   V.removeEventListener('loadedmetadata',restore);
   try{V.currentTime=Math.min(st.time||0,Math.max(0,(V.duration||0)-0.05))}catch(_){}
   if(st.phase==='CHAT1')setState({...st,phase:'RETURN1'});
   else if(st.phase==='CHAT2')setState({...st,phase:'RETURN2'});
   V.pause();
   dbg('Returned — paused.','good');
 };
 if(V.readyState>=1)restore(); else V.addEventListener('loadedmetadata',restore);
}
window.addEventListener('pageshow',restoreFromState);
</script></body></html>
