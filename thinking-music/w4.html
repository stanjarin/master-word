<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f0f">
<title>YouTube</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100%}
.top{height:57px;display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid #292929}
.yt{width:32px;height:23px;background:#f03a2c;border-radius:7px;display:grid;place-items:center}
.tri{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #fff;margin-left:2px}
.logo{font-size:21px;font-weight:800}
.search{margin-left:auto;font-size:25px;color:#bbb}
.stage{position:relative;background:#000;width:100%;aspect-ratio:16/9;overflow:hidden;-webkit-user-select:none;user-select:none}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.cover{position:absolute;inset:0;display:grid;place-items:center}
.play{width:76px;height:54px;border-radius:15px;background:#e52d20;display:grid;place-items:center}
.play .tri{border-top-width:11px;border-bottom-width:11px;border-left-width:18px}
.info{padding:16px}
.title{font-size:20px;line-height:1.3;font-weight:650}
.meta{color:#aaa;font-size:13px;margin-top:7px}
.channel{display:flex;align-items:center;gap:11px;border-top:1px solid #292929;margin-top:18px;padding-top:16px}
.avatar{width:40px;height:40px;border-radius:50%;background:#858585}
.name{font-size:17px;font-weight:650}.sub{font-size:12px;color:#aaa;margin-top:3px}
.debug{margin:8px 16px;padding:9px 11px;border:1px solid #2c2c2c;border-radius:10px;color:#777;font-size:11px;min-height:31px}
.debug.good{color:#30d158}.debug.bad{color:#ff453a}
</style>
</head>
<body>
<div class="top">
 <div class="yt"><div class="tri"></div></div><div class="logo">YouTube</div><div class="search">⌕</div>
</div>

<div class="stage" id="stage">
 <video id="video" playsinline preload="auto" src="lucky.mp4"></video>
 <div class="cover" id="cover"><div class="play"><div class="tri"></div></div></div>
</div>

<div class="info">
 <div class="title" id="title">I've Been Everywhere — Lucky Starr</div>
 <div class="meta">Thinking music</div>
 <div class="channel"><div class="avatar"></div><div><div class="name" id="artist">Lucky Starr</div><div class="sub">I've Been Everywhere</div></div></div>
</div>
<div class="debug" id="debug">W4 — tap the video, say 3 words + OK.</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const V=document.getElementById('video'), ST=document.getElementById('stage'),
C=document.getElementById('cover'), D=document.getElementById('debug'),
T=document.getElementById('title'), A=document.getElementById('artist');

let rec=null, transcript='', captured=false, performer='lucky', pass=1;
let holdTimer=null, suppressTap=false;

function setDebug(s, cls=''){
 D.className='debug '+cls; D.textContent=s;
}
function setPerformer(who){
 performer=who;
 if(who==='cash'){
   V.src='cash.mp4'; T.textContent="I've Been Everywhere — Johnny Cash"; A.textContent='Johnny Cash';
 } else {
   V.src='lucky.mp4'; T.textContent="I've Been Everywhere — Lucky Starr"; A.textContent='Lucky Starr';
 }
 V.load(); C.style.display='grid';
}
function primeAndListen(){
 if(captured){ if(V.paused) V.play().catch(()=>{}); else V.pause(); return; }
 if(!SR){setDebug('SpeechRecognition unavailable.','bad');return}
 transcript='';
 // This tap is a user gesture: briefly prime audio permission.
 V.muted=false;
 let p=V.play();
 if(p&&p.then)p.then(()=>{V.pause();V.currentTime=0}).catch(()=>{});
 C.style.display='none';
 setDebug('LISTENING… say three words, then OK.','good');

 rec=new SR(); rec.lang='en-AU'; rec.continuous=true; rec.interimResults=true;
 rec.onresult=e=>{
   let finals='', interim='';
   for(let i=e.resultIndex;i<e.results.length;i++){
     const x=e.results[i][0].transcript;
     if(e.results[i].isFinal) finals+=' '+x; else interim+=' '+x;
   }
   if(finals) transcript=(transcript+' '+finals).replace(/\s+/g,' ').trim();
   const heard=(transcript+' '+interim).replace(/\s+/g,' ').trim();
   setDebug('Heard: '+heard);
   if(/\b(okay|ok)\b/i.test(heard)){
     transcript=heard.replace(/\b(okay|ok)\b.*$/i,'').trim();
     captured=true; try{rec.stop()}catch(_){}
     setDebug('Captured: '+transcript,'good');
     V.currentTime=0;
     C.style.display='none';
     V.play().catch(()=>setDebug('Captured. Tap video once to start playback.','bad'));
   }
 };
 rec.onerror=e=>setDebug('Voice error: '+e.error,'bad');
 try{rec.start()}catch(e){setDebug('Could not start listening.','bad')}
}
function buildPrompt(){
 const more=pass===1?'':' Previous suggestions were not useful. Broaden the plausible category and return DIFFERENT candidates.';
 return `Infer a hidden MASTER WORD from three spoken clues. Speech recognition may have errors. Clue 1 is another word in the same plausible category as the master word. Clue 2 begins with the same FIRST LETTER as the master word. Clue 3 begins with the same SECOND LETTER as the master word. Clues: "${transcript}".${more} Return 8 likely master words, best first, no explanation.`;
}
function goChat(){
 if(!captured){setDebug('No clues captured.','bad');return}
 sessionStorage.setItem('tm4_state',JSON.stringify({
   performer, pass, time:V.currentTime, transcript
 }));
 V.pause();
 location.href='https://chatgpt.com/?q='+encodeURIComponent(buildPrompt());
}
function longAction(){
 if(!captured)return;
 // If we've returned from first query while Lucky is paused, switch to Cash.
 if(sessionStorage.getItem('tm4_returned')==='yes' && performer==='lucky'){
   sessionStorage.removeItem('tm4_returned');
   pass=2;
   setPerformer('cash');
   setDebug('This might work better.');
   C.style.display='none';
   V.currentTime=0; V.play().catch(()=>{});
   return;
 }
 goChat();
}

function beginHold(){
 suppressTap=false;
 holdTimer=setTimeout(()=>{suppressTap=true;longAction()},700);
}
function endHold(){clearTimeout(holdTimer)}

ST.addEventListener('touchstart',beginHold,{passive:true});
ST.addEventListener('touchend',()=>{endHold();if(!suppressTap)primeAndListen()},{passive:true});
ST.addEventListener('touchmove',endHold,{passive:true});
ST.addEventListener('mousedown',beginHold);
ST.addEventListener('mouseup',()=>{endHold();if(!suppressTap)primeAndListen()});
ST.addEventListener('mouseleave',endHold);

window.addEventListener('pageshow',()=>{
 const raw=sessionStorage.getItem('tm4_state');
 if(!raw)return;
 try{
   const s=JSON.parse(raw);
   transcript=s.transcript||''; captured=!!transcript; pass=s.pass||1;
   setPerformer(s.performer||'lucky');
   V.addEventListener('loadedmetadata',function restore(){
     V.removeEventListener('loadedmetadata',restore);
     V.currentTime=Math.min(s.time||0, V.duration||9999);
     V.pause(); C.style.display='none';
     setDebug('Returned — paused.','good');
   });
   sessionStorage.setItem('tm4_returned','yes');
 }catch(e){}
});
</script>
</body></html>
