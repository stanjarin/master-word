<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100%}
.top{height:57px;display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid #292929}
.yt{width:32px;height:23px;background:#f03a2c;border-radius:7px;display:grid;place-items:center}
.tri{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #fff;margin-left:2px}
.logo{font-size:21px;font-weight:800}.search{margin-left:auto;font-size:25px;color:#bbb}
.stage{position:relative;background:#000;width:100%;aspect-ratio:16/9;overflow:hidden;-webkit-user-select:none;user-select:none}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.playbtn{position:absolute;inset:0;margin:auto;width:76px;height:54px;border:0;border-radius:15px;background:#e52d20;display:grid;place-items:center}
.playbtn .tri{border-top-width:11px;border-bottom-width:11px;border-left-width:18px}
.info{padding:16px}.title{font-size:20px;line-height:1.3;font-weight:650}.meta{color:#aaa;font-size:13px;margin-top:7px}
.channel{display:flex;align-items:center;gap:11px;border-top:1px solid #292929;margin-top:18px;padding-top:16px}
.avatar{width:40px;height:40px;border-radius:50%;background:#858585}.name{font-size:17px;font-weight:650}.sub{font-size:12px;color:#aaa;margin-top:3px}
.debug{margin:8px 16px;padding:9px 11px;border:1px solid #2c2c2c;border-radius:10px;color:#777;font-size:11px;min-height:31px}
.good{color:#30d158}.bad{color:#ff453a}
</style></head>
<body>
<div class="top"><div class="yt"><div class="tri"></div></div><div class="logo">YouTube</div><div class="search">⌕</div></div>

<div class="stage" id="stage">
  <video id="video" playsinline preload="auto" src="lucky.mp4"></video>
  <button class="playbtn" id="playbtn" aria-label="Play"><div class="tri"></div></button>
</div>

<div class="info">
  <div class="title" id="title">I've Been Everywhere — Lucky Starr</div>
  <div class="meta">Thinking music</div>
  <div class="channel">
    <div class="avatar"></div>
    <div><div class="name" id="artist">Lucky Starr</div><div class="sub">I've Been Everywhere</div></div>
  </div>
</div>
<div class="debug" id="debug">W8 — Play → speak 3 words + OK.</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const V=document.getElementById('video');
const P=document.getElementById('playbtn');
const ST=document.getElementById('stage');
const D=document.getElementById('debug');
const T=document.getElementById('title');
const A=document.getElementById('artist');

let rec=null, transcript='', captured=false, performer='lucky', pass=1;
let holdTimer=null, longFired=false;
const KEY='thinkingMusicW8';

function dbg(s,c=''){ D.className='debug '+c; D.textContent=s; }

function setPerformer(who, load=true){
  performer=who;
  if(who==='cash'){
    T.textContent="I've Been Everywhere — Johnny Cash";
    A.textContent='Johnny Cash';
    if(load){ V.src='cash.mp4'; V.load(); }
  } else {
    T.textContent="I've Been Everywhere — Lucky Starr";
    A.textContent='Lucky Starr';
    if(load){ V.src='lucky.mp4'; V.load(); }
  }
}

function saveState(phase){
  const state={
    phase, transcript, performer, pass,
    time:Number.isFinite(V.currentTime)?V.currentTime:0
  };
  sessionStorage.setItem(KEY,JSON.stringify(state));
}

function loadState(){
  try{return JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(e){return null}
}

function clearState(){ sessionStorage.removeItem(KEY); }

function firstPrompt(){
  return `Infer a hidden MASTER WORD from three spoken clues. Speech recognition may have errors. Clue 1 is another word in the same plausible category as the master word. Clue 2 begins with the same FIRST LETTER as the master word. Clue 3 begins with the same SECOND LETTER as the master word. Clues: "${transcript}". Return 8 likely master words, best first, no explanation.`;
}
function secondPrompt(){
  return `Infer a hidden MASTER WORD from three spoken clues. Speech recognition may have errors. Clue 1 is another word in the same plausible category as the master word. Clue 2 begins with the same FIRST LETTER as the master word. Clue 3 begins with the same SECOND LETTER as the master word. Clues: "${transcript}". The previous suggestions were not useful. BROADEN the plausible category and return 8 DIFFERENT likely master words, best first, no explanation.`;
}

P.addEventListener('click',()=>{
  clearState();
  setPerformer('lucky');
  pass=1; captured=false; transcript='';

  if(!SR){ dbg('SpeechRecognition unavailable.','bad'); return; }
  dbg('LISTENING… say three words, then OK.','good');

  rec=new SR();
  rec.lang='en-AU';
  rec.continuous=true;
  rec.interimResults=true;

  rec.onresult=e=>{
    let finals='',interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const x=e.results[i][0].transcript;
      if(e.results[i].isFinal) finals+=' '+x; else interim+=' '+x;
    }
    if(finals) transcript=(transcript+' '+finals).replace(/\s+/g,' ').trim();
    const heard=(transcript+' '+interim).replace(/\s+/g,' ').trim();
    dbg('Heard: '+heard);

    if(/\b(okay|ok)\b/i.test(heard)){
      transcript=heard.replace(/\b(okay|ok)\b.*$/i,'').trim();
      captured=true;
      try{rec.stop()}catch(_){}
      dbg('Captured: '+transcript,'good');
      P.style.display='none';
      V.currentTime=0;
      V.play().catch(e=>dbg('Playback blocked: '+e.name,'bad'));
    }
  };
  rec.onerror=e=>dbg('Voice error: '+e.error,'bad');
  rec.onend=()=>{ if(!captured) dbg('Stopped before OK. Tap Play and try again.','bad'); };
  try{rec.start()}catch(e){ dbg('Could not start recognition.','bad'); }
});

function goChat(){
  if(!captured){ dbg('No clues captured.','bad'); return; }
  V.pause();
  saveState('away');
  const q=pass===1 ? firstPrompt() : secondPrompt();
  location.href='https://chatgpt.com/?q='+encodeURIComponent(q);
}

function switchToCash(){
  pass=2;
  setPerformer('cash');
  dbg('This might work better.','good');
  V.currentTime=0;
  V.play().catch(e=>dbg('Cash playback blocked: '+e.name,'bad'));
  saveState('cashPlaying');
}

function longAction(){
  if(!captured)return;
  const s=loadState();
  if(performer==='lucky' && s && s.phase==='returned'){
    switchToCash();
  } else {
    goChat();
  }
}

function beginHold(){
  if(!captured)return;
  longFired=false;
  holdTimer=setTimeout(()=>{longFired=true;longAction()},700);
}
function cancelHold(){ clearTimeout(holdTimer); }

ST.addEventListener('touchstart',beginHold,{passive:true});
ST.addEventListener('touchend',cancelHold,{passive:true});
ST.addEventListener('touchmove',cancelHold,{passive:true});
ST.addEventListener('mousedown',beginHold);
ST.addEventListener('mouseup',cancelHold);
ST.addEventListener('mouseleave',cancelHold);

// Ordinary video tap remains a simple play/pause toggle once the routine is running.
V.addEventListener('click',()=>{
  if(!captured || longFired)return;
  if(V.paused) V.play().catch(()=>{});
  else V.pause();
});

window.addEventListener('pageshow',()=>{
  const s=loadState();
  if(!s || s.phase!=='away') return;

  transcript=s.transcript||'';
  captured=!!transcript;
  pass=s.pass||1;
  setPerformer(s.performer||'lucky');
  P.style.display='none';

  const restore=()=>{
    V.removeEventListener('loadedmetadata',restore);
    const t=Math.min(s.time||0, Math.max(0,(V.duration||0)-0.05));
    try{V.currentTime=t}catch(_){}
    V.pause();
    sessionStorage.setItem(KEY,JSON.stringify({...s,phase:'returned'}));
    dbg('Returned — paused.','good');
  };
  if(V.readyState>=1) restore();
  else V.addEventListener('loadedmetadata',restore);
});
</script>
</body></html>
